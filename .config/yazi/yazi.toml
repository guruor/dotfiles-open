# A TOML linter such as https://taplo.tamasfe.dev/ can use this schema to validate your config.
# If you encounter any issues, please make an issue at https://github.com/yazi-rs/schemas.
# Default config: https://github.com/sxyazi/yazi/blob/latest/yazi-config/preset/yazi.toml
#:schema https://yazi-rs.github.io/schemas/yazi.json

[mgr]
ratio = [1, 3, 4]
show_hidden = true
sort_by = "mtime"
sort_reverse = true
linemode = "size"

[preview]
wrap = "yes"
max_width = 1500
max_height = 1500

[input]
cursor_blink = true

[opener]
sc-im = [{ run = 'sc-im "$1"', desc = "sc-im", block = true, for = "unix" }]

[open]
prepend_rules = [
  # Mime types
  # { mime = "application/pdf", use = "pdf" },

  # File extensions
  { url = "*.csv", use = ["edit", "sc-im", "open", "reveal"] },
  { url = "*.xlsx", use = ["sc-im", "open", "reveal"] },
]

# Git plugin
[[plugin.prepend_fetchers]]
group = "git"
url = "*"
run = "git"

[[plugin.prepend_fetchers]]
group = "git"
url = "*/"
run = "git"

[tasks]
image_bound = [ 65535, 65535 ]
