# hop - one key, one place.
#
# Blocks, not columns. A value runs to the end of its line, so it may contain
# | , spaces and quotes, and no field can shift because there are no positions.
#
#   [name]         an entry: a thing you can point a key at
#     app =        pattern(s) over the application name      (optional)
#     title =      pattern(s) over the window title          (optional)
#     action =     focus   go to it wherever it lives, switching space if needed
#                  toggle  go to it and pull it into the space you are in,
#                          or minimise it if you are already on it
#     miss =       nothing    do nothing
#                  open-app   launch the app field (must be one literal name)
#                  spawn:CMD  run CMD, then focus the window it produces
#
#   [slot:name]    a slot: what a key points at
#     mode =       focus   pressing walks every window of every target
#                  swap    pressing shows one target and hides the others
#     max =        how many targets it may hold (default 2)
#
# app and title are comma separated lists of extended regexes over the app name
# and the window title. A window matches if ANY element matches. Matching is
# case-insensitive and unanchored, so anchor with ^...$ for an exact match.
#
# The comma is the separator, which is how you say "any of these apps":
#
#     [browsers]
#     app = Brave Browser,Firefox,Google Chrome
#
# Candidates are ordered NEWEST WINDOW FIRST. yabai numbers windows from a
# monotonic counter, so the highest id is the most recently created one: when you
# are not on the app, a press lands on its newest window, which is the Slack
# huddle or Zoom meeting window that just appeared. Press again for older ones.
#
# Slot contents are not written here. They are machine local state, written by
# `hop pick <slot>` into ~/.local/state/hop/slots, so the config stays the same
# while the keys change meaning.
#
# A block needs a name and at least one of app or title. Blank lines and lines
# starting with # are ignored. `hop list` shows what every entry matches right
# now, `hop slots` shows what each slot holds, `hop -n <name>` shows what a press
# would do without doing it.

# --- apps, launched only if they are not already running ---------------------
[browser]
app = Brave Browser
miss = open-app

[personal-browser]
app = Firefox
miss = open-app

# --- one key, several apps: pressing it again walks every window of all of them
[browsers]
app = Brave Browser,Firefox,Google Chrome
miss = nothing

# --- an app that must never be woken up --------------------------------------
# When Zoom is not running this key is inert, instead of starting it and holding
# memory for a call you are not on. Both names are listed because yabai reports
# the app as "Zoom" while `open -a` needs the bundle name "zoom.us".
[call]
app = Zoom,zoom.us
miss = nothing

# --- named teammates --------------------------------------------------------
[comms]
app = Slack,Telegram
miss = nothing

[notion]
app = Notion
miss = open-app

[mail]
app = Microsoft Outlook
miss = open-app

[miro]
app = Miro
miss = open-app

[obsidian]
app = Obsidian
miss = open-app

[postman]
app = Postman
miss = open-app

# --- the pads ---------------------------------------------------------------
# The window title does the identifying; hop adds the on-miss policy. A pad whose
# command exits keeps the shell after it, so the window stays open.
[pad1]
app = kitty
title = ^Pad1$
action = toggle
miss = spawn:openterm --title "Pad1" --shell "$SHELL" --cmd-str "scratchpad Servers; $SHELL"

[pad2]
app = kitty
title = ^Pad2$
action = toggle
miss = spawn:openterm --title "Pad2" --shell "$SHELL" --cmd-str "scratchpad Pad; $SHELL"

[pad3]
app = kitty
title = ^Pad3$
action = toggle
miss = spawn:openterm --title "Pad3" --shell "$SHELL" --cmd-str "scratchpad Code; $SHELL"

[padnotes]
app = kitty
title = ^Notes$
action = toggle
miss = spawn:openterm --title "Notes" --shell "$SHELL" --cmd-str "notetaker; $SHELL"

[padbottom]
app = kitty
title = ^Bottom$
action = toggle
miss = spawn:openterm --title "Bottom" --shell "$SHELL" --cmd-str "btm -b; $SHELL"

[padmusic]
app = kitty
title = ^TermMusic$
action = toggle
miss = spawn:openterm --title "TermMusic" --shell "$SHELL" --cmd-str "rmpc; $SHELL"

[padfiles]
app = kitty
title = ^File Manager$
action = toggle
miss = spawn:openterm --title "File Manager" --shell "$SHELL" --cmd-str "yazi; exec $SHELL"

# --- slots -------------------------------------------------------------------
# What a key points at. Fill them from the picker, with the windows that are open
# at the time: hop pick semicolon
#
# A slot is named after its key, using Apple's own ANSI key name (lowercased, with
# the kVK_ANSI_ prefix stripped):  ; = semicolon   ' = quote   \ = backslash
# Letters and digits are simply themselves, so the scheme covers any key:
#
#   meh - ;     hop semicolon
#   meh - '     hop quote
#   meh - \     hop backslash
#
# The three pad keys (, . /) keep their own pads for now. If you ever want two
# pads on one key, give it a slot with mode = swap and pick both: a press shows
# one and hides the other.

[slot:semicolon]
mode = focus

[slot:quote]
mode = focus

[slot:backslash]
mode = focus
